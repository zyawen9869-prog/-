<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小六壬占卜</title>
<style>
  body { font-family: "Helvetica Neue", Arial, sans-serif; margin:0; padding:16px; background:#f0f2f5; }
  h2 { text-align:center; margin-bottom:12px; color:#333; }
  .card { background: #fff; padding: 20px; margin-bottom: 16px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
  input, select, button { width:100%; padding: 14px; margin:8px 0; border-radius:8px; border:1px solid #ccc; box-sizing:border-box; font-size:16px; }
  button { background:#4a90e2; color:#fff; border:none; font-weight:bold; cursor:pointer; }
  button:active { background:#357ABD; }
  .result { font-size:20px; font-weight:bold; text-align:center; padding:12px 0; }
  .description { margin-top:8px; font-size:16px; text-align:center; color:#555; white-space:pre-wrap; }
  .history { font-size:14px; color:#333; margin-top:8px; max-height:300px; overflow-y:auto; }
  .history div { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid #ddd; padding:4px 0; gap:10px; }
  .delete-btn { font-size:12px; padding:2px 6px; background:#e74c3c; color:#fff; border:none; border-radius:4px; cursor:pointer; margin-left:6px; height:fit-content; }
  .delete-btn:active { background:#c0392b; }
  .stats { font-size:14px; color:#222; margin-bottom:8px; padding:8px; background:#eaf2f8; border-radius:8px; }
  .wuxing-help { font-size:14px; cursor:pointer; color:#4a90e2; margin-left:6px; }
  @media(max-width:480px){
    input, select, button{ font-size:18px; padding:16px; }
    .result{ font-size:22px; }
    .description{ font-size:18px; }
    .history{ font-size:16px; }
    .stats{ font-size:16px; }
  }
</style>
</head>

<body>
<h2>📜 小六壬占卜 </h2>

<div class="card">
  <label>请输入占卜问题：
    <input type="text" id="questionInput" placeholder="请在此输入你想占卜的问题" />
  </label>
</div>

<div class="card">
  <label>请选择该事项五行：
    <select id="wuXingSelect">
      <option value="">请选择五行</option>
      <option value="木">木</option>
      <option value="火">火</option>
      <option value="土">土</option>
      <option value="金">金</option>
      <option value="水">水</option>
    </select>
    <span class="wuxing-help" onclick="showWuXingHelp()">?</span>
  </label>
</div>

<div id="currentTime" class="card">正在获取当前时间...</div>
<div id="lunarDateDisplay" class="card">正在获取当前农历...</div>

<div id="result" class="card">
  <div class="result">正在计算小六壬结果...</div>
  <div class="description" id="resultDescription"></div>
  <div class="description" id="shengkeHint" style="color:#e67e22;"></div>
  <button onclick="saveCurrentResult()">保存当前测算到历史</button>
</div>

<!-- ✅ 调试显示（默认开启，可在JS里 DEBUG_MODE 控制） -->
<div class="card" id="debugCard" style="display:none;">
  <h3 style="margin:0 0 8px 0;">🛠 调试信息</h3>
  <div id="debugInfo" class="description" style="text-align:left;"></div>
</div>

<div class="card">
  <h3>随机三数字占卜</h3>
  <button onclick="randomTripleDivination()">生成三数字起卦</button>
</div>

<div class="card">
  <h3>历史记录筛选</h3>
  <select id="filterMethod" onchange="renderHistory()">
    <option value="">按占卜类型筛选（全部）</option>
    <option value="小六壬自动测算">小六壬自动测算</option>
    <option value="随机三数字起卦">随机三数字起卦</option>
  </select>
  <select id="filterGua" onchange="renderHistory()">
    <option value="">按卦名筛选（全部）</option>
    <option value="大安">大安</option>
    <option value="留连">留连</option>
    <option value="速喜">速喜</option>
    <option value="赤口">赤口</option>
    <option value="小吉">小吉</option>
    <option value="空亡">空亡</option>
  </select>
</div>

<div class="card">
  <h3>历史记录准确率</h3>
  <div id="accuracy" class="stats">暂无数据</div>
</div>

<div class="card">
  <h3>历史记录</h3>
  <div id="history" class="history">暂无记录</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.2.35/lunar.min.js"></script>
<script>
// ==========================
// ✅ 调试开关：想隐藏就改 false
// ==========================
let DEBUG_MODE = true;

// 六神
const sixShen = [
  { name:"大安", desc:"属木，生发、稳定。数字对应1、4、7。阴主被动。东方。青色（关联物品/服饰）。左腿、肝/木（健康）。吉祥、顺利、安定。地位：高贵，贵人，尊贵，富贵。事务：婚姻、男女之事、婚事、阳宅（住宅风水）。大安为吉宫，主稳定和正面事务。" },
  { name:"留连", desc:"属土，（阴土，夹水），拖延、牵绊、泥泞。数字对应2、5、8。主玄武，象征事难成、去着未回、口舌是非。状态：拖延、牵连、恋恋不舍、不愿离开。财物：财帛、钱财、沼泽地、阴地、田园。疾病：虚病（如癔症）、邪病（鬼魂冲撞）、慢性病。留连属土，主纠缠和延迟，需注意健康与财务纠纷。阴主被动。南方。暗色（如灰色、深色）（关联物品/服饰）。左臂、胃/土（健康）。" },
  { name:"速喜", desc:"属火，快、动、喜。数字对应3、6、9。阳主主动。南方。红色（关联物品/服饰）。头脑、心/火（健康）。喜庆：喜气、喜悦、喜乐、喜欢。速度：快速、急速、马不停蹄（行动迅速）。性格：聪明、活跃、多智、善辩、多言。速喜属火，主好事来得快，但需防言多必失。" },
  { name:"赤口", desc:"属金，刀兵、口舌。数字对应1、4、7。阴主被动。西方。白色（关联物品/服饰）。右臂、肺/金（健康）。凶灾：凶事、凶险、损伤、伤残。疾病：急病、重病、伤灾（如意外受伤）。性格：性刚、强悍、好勇、果断、豪爽、但脾气暴躁、行事露骨。赤口属金，主口舌是非与突发灾祸，需谨慎言行。" },
  { name:"小吉", desc:"属土，（阳土，带木），行动、外出。数字对应2、5、8。阳主主动。北方。黄色（关联物品/服饰）。右腿、脾/土（健康）。动土：起造，建造，拆迁，修坟等工程。出行：迁移、行走、道路相关。桃花：感情顾恋、情迷意乱、男女交欢、色情。小吉为阳土，主行动和桃花，但需防情感纠葛。" },
  { name:"空亡", desc:"属土（水），空、失、虚。数字对应3、6、9。阴主被动。黑色（关联物品/服饰）。生殖器、肾/水（健康）。灾难：牢狱之灾、空想、妄想、不现实。损失：遗失、走失、失踪、消失、遗忘。情欲：好色、贪色、迷花恋色。空亡属水，主虚无和损失，需防破财或上当受骗。" }
];

// 仅用于显示
const shiChen = [
  "子时 (23-01)","丑时 (01-03)","寅时 (03-05)","卯时 (05-07)","辰时 (07-09)","巳时 (09-11)",
  "午时 (11-13)","未时 (13-15)","申时 (15-17)","酉时 (17-19)","戌时 (19-21)","亥时 (21-23)"
];

let lastResult = null;

// 五行说明
function showWuXingHelp(){
  alert(`五行选择参考说明：
【方法1：类别/问题类型判断】
木：生长、学习、积累、规划、文化、创意 → 技能成长、本事提升、学习、种植、文学、教育、艺术相关、学习技能 / 转专业 / 考证为事业服务
火：行动、速度、爆发、机会、名气、热情 → 创业、转型、跳槽、冲刺阶段、竞赛、工作、恋爱、投资决策、事业发展快不快 / 能不能成 / 适不适合现在冲
土：稳定、根基、承载、长期、稳重、财产、土地 →编制、长期合同、稳定收入、房产、建筑、土地产权、农业、储蓄、事业是否稳定 / 能不能长期做 / 饭碗稳不稳
金：制度、职位、规则、裁决、工具、交易 → 经济、金钱、科技、金属、管理、公司架构、考核、公司发展、工作 / 职位 / 升职 / 上司 / 权力
水：沟通、人际、渠道、流动、交流、智慧 → 销售、谈判、客户关系、旅行、法律、流动资产、事业中的人际 / 沟通/ 销售

【方法2：按具体事物判断】
物理属性法：
金属 → 金
水、河流、海 → 水
木、植物 → 木
火、灯、光 → 火
土、地、房屋 → 土

象征意义法：
财、金钱 → 金
感情 → 火
家庭 → 土
学习 → 木
流动、变化 → 水`);
}

// ==========================
// ✅ B方案：子=1 丑=2 ... 亥=12
// ==========================
function getShiChenNumber(now){
  const h = now.getHours();
  if (h === 23 || h === 0) return 1; // 子时 23-01
  return Math.floor((h + 1) / 2) + 1; // 01-02丑=2 ... 21-22亥=12
}

// 更新时间 + 返回农历/时辰序号
function updateCurrentTime(){
  const now = new Date();
  const hours = now.getHours();
  const minutes = now.getMinutes().toString().padStart(2,'0');
  const seconds = now.getSeconds().toString().padStart(2,'0');

  const shiNum = getShiChenNumber(now); // ✅ 1..12

  document.getElementById("currentTime").innerText =
    `当前时间：${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()} ${hours}:${minutes}:${seconds} 时辰：${shiChen[shiNum-1]}`;

  const lunar = Solar.fromDate(now).getLunar();
  document.getElementById("lunarDateDisplay").innerText =
    `当前农历：${lunar.getYear()}年 ${lunar.getMonth()}月 ${lunar.getDay()}日`;

  return { now, lunar, shiNum };
}

// 生克关系
const shengKeMap = { 木:{生:"火",克:"土"}, 火:{生:"土",克:"金"}, 土:{生:"金",克:"水"}, 金:{生:"水",克:"木"}, 水:{生:"木",克:"火"}};
const liurenWuXingMap = { "大安":"木", "留连":"土", "速喜":"火", "赤口":"金", "小吉":"土", "空亡":"水" };

/** ✅ 详细生克解释 */
function computeShengKe(wuxing, liuren){
  if(!wuxing) return "";
  const lwx = liurenWuXingMap[liuren];
  if(!lwx) return "";

  const A = wuxing; // 事项五行
  const B = lwx;    // 卦五行

  const AtoB_sheng = shengKeMap[A] && shengKeMap[A].生 === B;
  const AtoB_ke    = shengKeMap[A] && shengKeMap[A].克 === B;

  const BtoA_sheng = shengKeMap[B] && shengKeMap[B].生 === A;
  const BtoA_ke    = shengKeMap[B] && shengKeMap[B].克 === A;

  let relation = "";
  let explain = "";

  if (A === B) {
    relation = "同行（同五行）";
    explain = "事项与卦同气，整体偏中性稳定，关键看卦的吉凶含义与现实行动。";
  } else if (AtoB_sheng) {
    relation = `事项五行(${A}) 生 卦五行(${B})`;
    explain = "你在“出力/供能”给这个卦象，往往代表推动、投入、顺势推进；但也可能表示更费心费力。";
  } else if (AtoB_ke) {
    relation = `事项五行(${A}) 克 卦五行(${B})`;
    explain = "事项对卦形成压制，常见为阻力、冲突、硬碰硬；建议谨慎、留余地，避免强推。";
  } else if (BtoA_sheng) {
    relation = `卦五行(${B}) 生 事项五行(${A})`;
    explain = "卦象对事项有“助力/滋养”，常见为外部条件支持、贵人助力、过程更顺。";
  } else if (BtoA_ke) {
    relation = `卦五行(${B}) 克 事项五行(${A})`;
    explain = "卦象对事项形成“牵制/消耗”，常见为被压制、被约束、进展受限；建议先稳住、再调整策略。";
  } else {
    relation = "无直接生克";
    explain = "五行之间不构成直接生克，生克线索较弱；可更多参考卦本身的吉凶象意与当下现实因素。";
  }

  return `【五行解释】\n当前卦：${liuren}（五行：${B}）\n事项五行：${A}\n关系：${relation}\n提示：${explain}`;
}

// ✅ 传统：月上起日，日上起时（子=1..亥=12）
function autoCalcLiuren(){
  const { now, lunar, shiNum } = updateCurrentTime();

  const m = lunar.getMonth(); // 1..12
  const d = lunar.getDay();   // 1..30

  // 1) 月落宫：从大安起数到月
  const monthIndex = (m - 1) % 6;

  // 2) 月上起日：从月落宫起数到日
  const dayIndex = (monthIndex + (d - 1)) % 6;

  // 3) 日上起时：从日落宫起数到时（子=1..12）
  const hourIndex = (dayIndex + (shiNum - 1)) % 6;

  const result = sixShen[hourIndex];

  document.querySelector("#result .result").innerText = `当前小六壬结果：${result.name} 卦`;
  document.getElementById("resultDescription").innerText = result.desc;

  // ✅ 实时读取下拉框显示生克
  const wuxingNow = document.getElementById("wuXingSelect").value;
  document.getElementById("shengkeHint").innerText = wuxingNow ? computeShengKe(wuxingNow, result.name) : "";

  // ✅ 修复：历史字段统一用 result（兼容你原来的 renderHistory/renderAccuracy）
  lastResult = {
    result: result.name,
    description: result.desc,
    method: "小六壬自动测算",
    datetime: `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`
  };

  // ✅ 占卜过程
  const debugCard = document.getElementById("debugCard");
  const debugInfo = document.getElementById("debugInfo");
  if (DEBUG_MODE && debugCard && debugInfo) {
    debugCard.style.display = "block";
    const shiText = shiChen[shiNum - 1];
    debugInfo.innerText =
`公历：${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}
农历：${lunar.getYear()}年 ${m}月 ${d}日
时辰：${shiText}（序号=${shiNum}，子=1...亥=12）

【三步起数】
1) 月落宫：index=${monthIndex} → ${sixShen[monthIndex].name}
2) 月上起日：index=${dayIndex} → ${sixShen[dayIndex].name}
3) 日上起时：index=${hourIndex} → ${sixShen[hourIndex].name}

最终卦：${result.name}`;
  } else if (debugCard) {
    debugCard.style.display = "none";
  }
}

// 保存
function saveCurrentResult(){
  const question = document.getElementById("questionInput").value.trim();
  const wuXing = document.getElementById("wuXingSelect").value;
  if(!lastResult) return alert("没有可保存的测算结果！");
  if(!question) return alert("请输入占卜问题！");
  if(!wuXing) return alert("请选择事项五行！");

  let history = JSON.parse(localStorage.getItem("liurenHistory")||"[]");
  history.unshift({...lastResult, question, wuXing, numbers:[], note:"", actualResult:""});
  if(history.length>50) history.pop();
  localStorage.setItem("liurenHistory",JSON.stringify(history));
  renderHistory(); renderAccuracy();
  alert("已保存当前测算到历史记录！");
}

// 随机三数字
function randomTripleDivination(){
  const nums=[Math.floor(Math.random()*99+1),Math.floor(Math.random()*99+1),Math.floor(Math.random()*99+1)];
  const index = nums.reduce((a,b)=>a+b)%6;
  const result = sixShen[index];
  const now = new Date();
  const note = prompt("请输入你想占卜的事项（可留空）：","");

  let history = JSON.parse(localStorage.getItem("liurenHistory")||"[]");
  history.unshift({
    datetime:`${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
    lunar:"-",
    // 保留你原字段（不删除function/结构），但这里表示的是卦序号
    hourIndex:index,
    result:result.name,
    description:result.desc,
    method:"随机三数字起卦",
    numbers:nums,
    question:note,
    wuXing:"",
    note,
    actualResult:""
  });
  if(history.length>50) history.pop();
  localStorage.setItem("liurenHistory",JSON.stringify(history));

  document.querySelector("#result .result").innerText = `随机三数字占卜结果：${result.name} 卦`;
  document.getElementById("resultDescription").innerText = `数字：${nums.join(', ')} | ${result.desc}`;
  document.getElementById("shengkeHint").innerText = ""; // 随机起卦不强制生克提示

  renderHistory(); renderAccuracy();
}

// 历史记录
function deleteHistoryItem(index){
  let history = JSON.parse(localStorage.getItem("liurenHistory")||"[]");
  history.splice(index,1);
  localStorage.setItem("liurenHistory",JSON.stringify(history));
  renderHistory(); renderAccuracy();
}
function updateActual(index,value){
  let history = JSON.parse(localStorage.getItem("liurenHistory")||"[]");
  history[index].actualResult=value;
  localStorage.setItem("liurenHistory",JSON.stringify(history));
  renderHistory();
}
function renderHistory(){
  const history = JSON.parse(localStorage.getItem("liurenHistory")||"[]");
  const methodFilter = document.getElementById("filterMethod").value;
  const guaFilter = document.getElementById("filterGua").value;
  const historyEl=document.getElementById("history");

  if(history.length===0){historyEl.innerText="暂无记录";return;}
  historyEl.innerHTML="";

  history.forEach((item,index)=>{
    if(methodFilter && item.method!==methodFilter) return;

    // ✅ 兼容旧数据：resultName / result
    const gua = item.result || item.resultName || "";
    if(guaFilter && gua!==guaFilter) return;

    const div=document.createElement("div");
    div.innerHTML=`
      <div>
        <b>${item.datetime}</b> | 方法: ${item.method} | ${gua} 卦<br>
        占卜事项: ${item.question || "-"} | 五行: ${item.wuXing || "-"}<br>
        数字: ${item.numbers && item.numbers.length>0 ? item.numbers.join(', ') : "-"}<br>
        结果说明: ${item.description}<br>
        实际结果: <input type="text" value="${item.actualResult || ""}" onchange="updateActual(${index}, this.value)">
      </div>
      <button class="delete-btn" onclick="deleteHistoryItem(${index})">删除</button>
    `;
    historyEl.appendChild(div);
  });
}

// 准确率
function renderAccuracy(){
  const history=JSON.parse(localStorage.getItem("liurenHistory")||"[]");
  const methodFilter=document.getElementById("filterMethod").value;
  const guaFilter=document.getElementById("filterGua").value;

  let filtered=history.filter(item=>{
    if(methodFilter && item.method!==methodFilter) return false;
    const gua = item.result || item.resultName || "";
    if(guaFilter && gua!==guaFilter) return false;
    return true;
  });

  let totalFilled=0,hits=0;
  filtered.forEach(item=>{
    const gua = item.result || item.resultName || "";
    if(item.actualResult && item.actualResult.trim()!==""){
      totalFilled++;
      if(item.actualResult.includes(gua)) hits++;
    }
  });

  document.getElementById("accuracy").innerText =
    totalFilled===0 ? "暂无填写实际结果的数据"
    : `准确率：${Math.round(hits/totalFilled*100)}% (${hits}/${totalFilled})`;
}

// ✅ 选择五行后立即刷新生克提示（保留你的行为：触发重新计算）
document.addEventListener("DOMContentLoaded", ()=>{
  document.getElementById("wuXingSelect").addEventListener("change", ()=>{
    autoCalcLiuren();
  });
});

// 初始化：先算一次，再每分钟更新结果；时间每秒更新显示
updateCurrentTime();
autoCalcLiuren();
setInterval(updateCurrentTime, 1000);
setInterval(autoCalcLiuren, 60*1000);
</script>
</body>
</html>
